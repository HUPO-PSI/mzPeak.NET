name: test

on:
  push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v6
          - name: install miniserve
            run: |
              sudo apt-get update && sudo apt-get install -y miniserve
          - uses: actions/setup-dotnet@v5
            with:
                dotnet-version: "9.0.X"
          - name: test
            run: |
                dotnet test