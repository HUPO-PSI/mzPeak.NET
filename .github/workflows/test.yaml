name: test

on:
  push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v6
          - name: install miniserve
            run: |
              wget https://github.com/svenstaro/miniserve/releases/download/v0.35.0/miniserve-0.35.0-x86_64-unknown-linux-gnu -O miniserve
              chmod 775 miniserve
              sudo mv miniserve /usr/bin/
          - uses: actions/setup-dotnet@v5
            with:
                dotnet-version: "9.0.X"
          - name: test
            run: |
                dotnet test